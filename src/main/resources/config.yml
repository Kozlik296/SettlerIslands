# SettlerIslands configuration
#
# World border size in blocks (square, centred on 0,0).
border-size: 6000

# Ores per zone. Vanilla ores are removed everywhere and only these are placed.
# total  = approximate number of ore blocks on the whole island (spread evenly over its land)
# min-y / max-y = height range the ore can appear in
# vein   = average blocks per vein
# Deepslate versions are used automatically where the ore lands in deepslate.
ores:
  MEADOW:
    COAL_ORE:    { total: 8000,  min-y: 0,   max-y: 120, vein: 10 }
    COPPER_ORE:  { total: 2000,  min-y: -16, max-y: 80,  vein: 8 }
  IRONSTONE:
    IRON_ORE:    { total: 21000, min-y: -48, max-y: 170, vein: 9 }
    COAL_ORE:    { total: 6000,  min-y: 0,   max-y: 170, vein: 10 }
    COPPER_ORE:  { total: 2000,  min-y: -16, max-y: 100, vein: 8 }
  GLOOMREACH:
    GOLD_ORE:    { total: 6000,  min-y: -56, max-y: 60,  vein: 7 }
    REDSTONE_ORE: { total: 9000, min-y: -60, max-y: 30,  vein: 7 }
    COAL_ORE:    { total: 3000,  min-y: 0,   max-y: 120, vein: 10 }
  HIGHLANDS:
    COPPER_ORE:  { total: 8000,  min-y: -16, max-y: 120, vein: 10 }
    LAPIS_ORE:   { total: 3000,  min-y: -48, max-y: 64,  vein: 6 }
    EMERALD_ORE: { total: 600,   min-y: 60,  max-y: 230, vein: 1 }
    DIAMOND_ORE: { total: 500,   min-y: -60, max-y: -10, vein: 4 }
  NETHER:
    NETHER_QUARTZ_ORE: { total: 10000, min-y: 10, max-y: 120, vein: 9 }
    NETHER_GOLD_ORE:   { total: 2000,  min-y: 10, max-y: 120, vein: 8 }
    ANCIENT_DEBRIS:    { total: 150,   min-y: 8,  max-y: 30,  vein: 1 }
  FAR_REEF:
    DIAMOND_ORE: { total: 1200,  min-y: -60, max-y: 0,   vein: 4 }
    LAPIS_ORE:   { total: 1000,  min-y: -48, max-y: 40,  vein: 6 }
  TIMBERLANDS:
    COAL_ORE:    { total: 1000,  min-y: 20,  max-y: 90,  vein: 8 }

# Glowstone clusters on the surface of the Nether zone (clusters per chunk, 0-1 = chance)
nether-glowstone-per-chunk: 0.35

# ------------------------------------------------------------------ gameplay rules (island worlds only)
rules:
  # blocks placed further than this (sideways) from something that stands on the ground fall down
  support-span: 10
  # food spoils after this many hours of the carrying player's online time (chests keep food fresh)
  spoil-hours: 12
  # crops and breeding on Meadow are this many times faster
  meadow-growth: 2
  # banned: elytra flight, ender pearls, ender chests, shulker boxes, Nether/End portals,
  # chorus fruit teleporting, ice (or frost walker) over the open sea
  bans: true
  # location prices: one price per trade and place for everyone; each use makes the trade
  # 'step' worse (villager sells dearer / pays less), up to 'max' times; it drifts back with
  # the given half-life
  prices:
    step: 0.02
    max: 2.0
    half-life-hours: 12
  # trades the village villagers may not offer (iron and diamond gear, diamonds, bells)
  trade-filter: true
  # [shop] signs on chests
  chest-shops: true
